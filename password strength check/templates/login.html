{% extends 'base.html' %}

{% block content %}
<section class="auth-page">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <div class="brand brand-large">
        <span class="brand-icon"><i class="fa-solid fa-shield-halved"></i></span>
        <span>PassGuard</span>
      </div>
      <h1>Welcome back</h1>
      <p>Secure access to your password intelligence workspace.</p>
    </div>
    <form class="auth-form" id="loginForm">
      <label>
        <span>Email</span>
        <input type="email" placeholder="you@example.com" required />
      </label>
      <label>
        <span>Password</span>
        <div class="input-group auth-input-group">
          <input type="password" placeholder="Enter your password" required />
          <button class="icon-btn" type="button" id="authToggle"><i class="fa-solid fa-eye"></i></button>
        </div>
      </label>
      <div class="auth-meta">
        <label class="checkbox-row"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="primary-btn auth-submit" type="submit">Login</button>
      <button class="secondary-btn auth-submit" type="button">Create account</button>
      <div class="divider">or continue with</div>
      <div class="social-row">
        <button class="social-btn" type="button"><i class="fa-brands fa-google"></i> Google</button>
        <button class="social-btn" type="button"><i class="fa-brands fa-github"></i> GitHub</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
