<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>
    <div class="background-glow glow-3"></div>

    <header class="topbar">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-icon"><i class="fa-solid fa-shield-halved"></i></span>
        <span>PassGuard</span>
      </a>
      <nav class="nav-links">
        <a href="#hero">Home</a>
        <a href="#checker">Checker</a>
        <a href="#generator">Generator</a>
        <a href="#tips">Tips</a>
        <a href="#faq">FAQ</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
        <a href="{{ url_for('login') }}" class="login-btn">Login</a>
      </div>
    </header>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
